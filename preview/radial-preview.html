<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tinhead's Combat Hud — Radial Preview</title>
  <link rel="stylesheet" href="../styles/combat-hud.css" />
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(70, 90, 70, 0.35), transparent 45%),
        radial-gradient(ellipse at 70% 80%, rgba(40, 55, 80, 0.4), transparent 50%),
        linear-gradient(160deg, #1a2220 0%, #0e1218 45%, #1c1814 100%);
      color: #e8eef5;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
    }
    .preview-banner {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10001;
      max-width: 320px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.45);
      border-radius: 8px;
      pointer-events: none;
    }
    .preview-banner h1 {
      margin: 0 0 6px;
      font-size: 16px;
    }
    .preview-banner p {
      margin: 0;
      font-size: 12px;
      line-height: 1.4;
      opacity: 0.9;
    }
    .scene-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
    }
    .token-mock {
      position: fixed;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid rgba(220, 200, 120, 0.85);
      background:
        radial-gradient(circle at 35% 30%, #6a7a68, #2a332c 70%);
      box-shadow: 0 0 0 2px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    .token-mock.a { left: 22%; top: 38%; }
    .token-mock.b { left: 58%; top: 48%; }
    .token-mock.c { left: 40%; top: 62%; }
  </style>
</head>
<body>
  <div class="scene-grid"></div>
  <div class="token-mock a"></div>
  <div class="token-mock b"></div>
  <div class="token-mock c"></div>
  <div class="preview-banner">
    <h1>Tinhead's Combat Hud</h1>
    <p id="preview-note">Loading Cornholio the lesser…</p>
  </div>

  <script type="module">
    import {
      arcSegmentsForParent,
      centerArcOnIndex,
      mainSectionAngles,
      mainSectionById,
      sectionAnchor,
      sectionWedgePath,
      wedgeAnchor
    } from "../scripts/ui/radial-geometry.mjs";
    import { appendHubArt, appendWedgeArt } from "../scripts/ui/wedge-art.mjs";
    import { applyIconPalette } from "../scripts/ui/icon-color.mjs";
    import { wedgeCaptionLines } from "../scripts/ui/wedge-text.mjs";
    import { previewWedge } from "../scripts/data/module-icons.mjs";

    const CHROME = {
      dash: previewWedge("dash"),
      disengage: previewWedge("disengage"),
      dodge: previewWedge("dodge"),
      ready: previewWedge("ready"),
      castSpell: previewWedge("cast-spell"),
      useItem: previewWedge("use-item"),
      checks: previewWedge("checks"),
      check: previewWedge("check"),
      save: previewWedge("save"),
      endTurn: previewWedge("end-turn"),
      action: previewWedge("action"),
      bonus: previewWedge("bonus"),
      reaction: previewWedge("reaction"),
      attack: previewWedge("attack"),
      classFeature: previewWedge("class-feature"),
      channelDivinity: previewWedge("channel-divinity"),
      useAbility: previewWedge("use-ability"),
      spell0: previewWedge("spell-cantrip"),
      abilities: {
        str: previewWedge("str"), dex: previewWedge("dex"), con: previewWedge("constitution"),
        int: previewWedge("int"), wis: previewWedge("wis"), cha: previewWedge("cha")
      }
    };

    let clipSeq = 0;
    function nextClipId(prefix = "prev-clip") {
      clipSeq += 1;
      return `${prefix}-${clipSeq}`;
    }

    // Keep in sync with scripts/ui/combat-hud.mjs SIZE / RINGS.
    // Every wedge is 62px thick, with a 6px gap between rings.
    const SIZE = 760;
    const CX = SIZE / 2;
    const CY = SIZE / 2;
    const WEDGE_DEPTH = 62;
    const RING_GAP = 6;
    const mainInner = 42;
    const mainOuter = mainInner + WEDGE_DEPTH;
    const actionInner = mainOuter + RING_GAP;
    const actionOuter = actionInner + WEDGE_DEPTH;
    const nest1Inner = actionOuter + RING_GAP;
    const nest1Outer = nest1Inner + WEDGE_DEPTH;
    const nest2Inner = nest1Outer + RING_GAP;
    const nest2Outer = nest2Inner + WEDGE_DEPTH;
    const nest3Inner = nest2Outer + RING_GAP;
    const nest3Outer = nest3Inner + WEDGE_DEPTH;
    const RINGS = {
      hub: 34,
      mainInner,
      mainOuter,
      actionInner,
      actionOuter,
      nest1Inner,
      nest1Outer,
      nest2Inner,
      nest2Outer,
      nest3Inner,
      nest3Outer,
      flatInner: actionInner,
      flatOuter: actionOuter,
      flatNestInner: nest1Inner,
      flatNestOuter: nest1Outer,
      flatSpellInner: nest2Inner,
      flatSpellOuter: nest2Outer
    };

    function icon(bg, glyph, fg = "#f4f7fb") {
      return "data:image/svg+xml," + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="${bg}"/>
            <stop offset="100%" stop-color="#12161c"/>
          </linearGradient></defs>
          <rect width="64" height="64" rx="10" fill="url(#g)"/>
          <text x="32" y="40" text-anchor="middle" fill="${fg}" font-size="22" font-family="Georgia, serif">${glyph}</text>
        </svg>`
      );
    }

    const FALLBACK = previewWedge("fallback");

    const sheet = {
      name: "Cornholio the lesser",
      action: [],
      attack: [],
      ready: [],
      other: [],
      abilities: [],
      inventory: [],
      bonusInventory: [],
      levels: [],
      bonus: [],
      reaction: [],
      checks: []
    };
    let featureModesFor = () => [];
    let weaponModesFor = () => [];

    const params = new URLSearchParams(location.search);
    const shot = params.get("shot") || "action";
    const state = {
      section: shot === "bonus" ? "bonus"
        : shot === "reaction" ? "reaction"
        : shot === "checks" || shot === "check-roll" ? "checks"
        : shot === "main" ? null
        : "action",
      attackOpen: shot === "action" || shot === "tooltip" || shot === "weapon",
      otherOpen: false,
      readyOpen: shot === "ready",
      abilitiesOpen: false,
      featureNestId: null,
      castSpell: shot === "tooltip",
      useItem: shot === "items",
      weaponNest: shot === "weapon" ? "Wave" : null,
      opportunityOpen: false,
      useAbility: false,
      checksBranch: shot === "checks" || shot === "check-roll" ? "skills" : null,
      spellLevel: shot === "action" || shot === "tooltip" ? 0 : null,
      endTurnEnabled: shot !== "main"
    };
    let root, svg, tooltipEl, collapseTimer;

    function mount() {
      root = document.createElement("div");
      root.className = "tch-root";
      const backdrop = document.createElement("div");
      backdrop.className = "tch-backdrop";
      backdrop.addEventListener("pointerdown", () => {
        state.section = null;
        state.castSpell = false;
        state.useItem = false;
        state.spellLevel = null;
        draw();
      });
      root.appendChild(backdrop);

      const stage = document.createElement("div");
      stage.className = "tch-stage";
      root.appendChild(stage);

      svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.classList.add("tch-radial");
      svg.setAttribute("width", String(SIZE));
      svg.setAttribute("height", String(SIZE));
      svg.setAttribute("viewBox", `0 0 ${SIZE} ${SIZE}`);
      svg.addEventListener("pointermove", (ev) => {
        if (!tooltipEl.hidden) positionTooltip(ev);
      });
      stage.appendChild(svg);

      tooltipEl = document.createElement("div");
      tooltipEl.className = "tch-tooltip";
      tooltipEl.hidden = true;
      root.appendChild(tooltipEl);

      document.body.appendChild(root);
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          state.section = null;
          state.castSpell = false;
          state.useItem = false;
          state.weaponNest = null;
          state.useAbility = false;
          state.spellLevel = null;
          hideTooltip();
          draw();
        }
      });
      draw();
      if (shot === "tooltip") {
        const tip = sheet.levels[0]?.spells?.[0]?.tooltip;
        if (tip) showTooltip(tip, null);
      }
    }

    function clearNests() {
      state.attackOpen = false;
      state.readyOpen = false;
      state.otherOpen = false;
      state.abilitiesOpen = false;
      state.featureNestId = null;
      state.castSpell = false;
      state.useItem = false;
      state.weaponNest = null;
      state.useAbility = false;
      state.checksBranch = null;
      state.spellLevel = null;
    }

    function draw() {
      svg.replaceChildren();
      clipSeq = 0;
      drawMain();
      drawHub();
      if (state.section === "action") {
        drawAction();
        if (state.readyOpen) drawReady();
        else if (state.attackOpen) drawAttackNest(RINGS.nest1Inner, RINGS.nest1Outer);
        else if (state.otherOpen) drawOtherActions(RINGS.nest1Inner, RINGS.nest1Outer);
        else if (state.abilitiesOpen) drawAbilityFeatures(RINGS.nest1Inner, RINGS.nest1Outer);
        else if (state.useItem) drawInventory();
        if (state.readyOpen && state.attackOpen) drawAttackNest(RINGS.nest2Inner, RINGS.nest2Outer);
        if (state.featureNestId && (state.abilitiesOpen || state.otherOpen)) {
          drawFeatureModes(state.readyOpen ? RINGS.nest3Inner : RINGS.nest2Inner, state.readyOpen ? RINGS.nest3Outer : RINGS.nest2Outer);
        }
        if (state.weaponNest) drawWeaponSpecials();
        if (state.castSpell) {
          drawLevels();
          if (state.spellLevel != null) drawSpells(state.spellLevel);
        }
      } else if (state.section === "checks") {
        drawChecksMenu();
        if (state.checksBranch === "saves") drawSavingThrows();
        else if (state.checksBranch === "skills") drawSkills();
      } else if (state.section === "bonus") {
        drawFlat(sheet.bonus);
        if (state.featureNestId) drawFeatureModes(RINGS.flatNestInner, RINGS.flatNestOuter);
        if (state.useItem) drawInventory();
        if (state.castSpell) {
          drawLevels();
          if (state.spellLevel != null) drawSpells(state.spellLevel);
        }
      } else if (state.section === "reaction") {
        drawFlat(sheet.reaction);
        if (state.featureNestId) drawFeatureModes(RINGS.flatNestInner, RINGS.flatNestOuter);
        if (state.opportunityOpen) drawAttackNest(RINGS.flatNestInner, RINGS.flatNestOuter);
        if (state.castSpell) {
          drawLevels();
          if (state.spellLevel != null) drawSpells(state.spellLevel);
        }
      }
    }

    function drawHub() {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.classList.add("tch-hub", "tch-hub--has-art");
      if (!state.endTurnEnabled) g.classList.add("tch-hub--disabled");
      g.addEventListener("pointerdown", () => {
        // Preview: End Turn does not advance combat; Esc/backdrop still dismiss
        showTooltip({
          title: "End Turn",
          description: state.endTurnEnabled
            ? "Would call combat.nextTurn() in Foundry."
            : "Disabled without an active owned turn."
        }, null);
      });
      appendHubArt(g, {
        cx: CX, cy: CY, r: RINGS.hub,
        img: CHROME.endTurn,
        clipId: nextClipId("prev-hub")
      });
      const disk = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      disk.classList.add("tch-hub__disk");
      disk.setAttribute("cx", CX); disk.setAttribute("cy", CY); disk.setAttribute("r", RINGS.hub);
      g.appendChild(disk);
      const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.classList.add("tch-hub__label");
      label.setAttribute("x", CX); label.setAttribute("y", CY + 2);
      label.textContent = "End Turn";
      g.appendChild(label);
      const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
      sub.classList.add("tch-hub__sub");
      sub.setAttribute("x", CX); sub.setAttribute("y", CY + 14);
      sub.textContent = state.endTurnEnabled ? "next" : "—";
      g.appendChild(sub);
      svg.appendChild(g);
    }

    function drawMain() {
      const labels = {
        action: { name: "Action", img: CHROME.action },
        checks: { name: "Checks", img: CHROME.checks },
        bonus: { name: "Bonus Action", img: CHROME.bonus },
        reaction: { name: "Reaction", img: CHROME.reaction }
      };
      for (const ang of mainSectionAngles()) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.classList.add(
          "tch-segment", "tch-segment--main", "tch-segment--has-art",
          `tch-economy--${ang.id}`
        );
        if (state.section === ang.id) g.classList.add("tch-segment--active");
        g.dataset.economy = ang.id;
        const d = sectionWedgePath(CX, CY, RINGS.mainInner, RINGS.mainOuter, ang.start, ang.end);
        const meta = labels[ang.id];
        appendWedgeArt(g, {
          d, img: meta.img,
          inner: RINGS.mainInner, outer: RINGS.mainOuter,
          start: ang.start, end: ang.end,
          cx: CX, cy: CY,
          clipId: nextClipId(`prev-main-${ang.id}`)
        });
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.classList.add("tch-segment__fill");
        path.setAttribute("d", d);
        g.appendChild(path);
        const a = sectionAnchor(CX, CY, (RINGS.mainInner + RINGS.mainOuter) / 2, ang.start, ang.end);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.classList.add("tch-segment__label");
        text.setAttribute("x", a.x); text.setAttribute("y", a.y);
        text.textContent = meta.name;
        g.appendChild(text);
        g.addEventListener("pointerenter", (ev) => {
          clearCollapse();
          if (state.section === ang.id) {
            if (ang.id === "checks" && pointerRadius(ev) < RINGS.actionInner && state.checksBranch) {
              state.checksBranch = null;
              draw();
            }
            return;
          }
          state.section = ang.id;
          state.featureNestId = null;
          if (ang.id !== "action") {
            state.attackOpen = false;
            state.readyOpen = false;
            state.otherOpen = false;
            state.abilitiesOpen = false;
            state.castSpell = false;
            state.useItem = false;
            state.weaponNest = null;
            state.useAbility = false;
            state.spellLevel = null;
          }
          state.checksBranch = null;
          if (ang.id !== "reaction") state.opportunityOpen = false;
          draw();
        });
        svg.appendChild(g);
      }
    }

    function captionLines(caption) {
      return wedgeCaptionLines(caption);
    }

    function leaf(cfg) {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.classList.add("tch-segment");
      if (cfg.active) g.classList.add("tch-segment--active");
      if (cfg.proficiency === "proficient") g.classList.add("tch-segment--proficient");
      if (cfg.proficiency === "expertise") g.classList.add("tch-segment--expertise");
      if (cfg.itemArt) g.classList.add("tch-segment--item-art");
      if (cfg.itemArt && cfg.img) applyIconPalette(g, cfg.img);
      const eco = cfg.economy || state.section;
      if (eco) {
        g.classList.add(`tch-economy--${eco}`);
        g.dataset.economy = eco;
      }
      const d = sectionWedgePath(CX, CY, cfg.inner, cfg.outer, cfg.start, cfg.end);
      const a = sectionAnchor(CX, CY, (cfg.inner + cfg.outer) / 2, cfg.start, cfg.end);
      if (cfg.img) {
        g.classList.add("tch-segment--has-art");
        const art = appendWedgeArt(g, {
          d, img: cfg.img,
          inner: cfg.inner, outer: cfg.outer,
          start: cfg.start, end: cfg.end,
          cx: CX, cy: CY,
          clipId: nextClipId("prev-leaf")
        });
        if (art) {
          art.addEventListener("error", () => {
            art.setAttribute("href", FALLBACK);
            art.setAttributeNS("http://www.w3.org/1999/xlink", "href", FALLBACK);
          });
        }
      }
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.classList.add("tch-segment__fill");
      path.setAttribute("d", d);
      g.appendChild(path);
      if (cfg.label) {
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.classList.add("tch-segment__label");
        text.setAttribute("x", a.x);
        text.setAttribute("y", a.y + (cfg.caption ? -8 : 0));
        text.textContent = cfg.label;
        g.appendChild(text);
      }
      if (cfg.caption) {
        const cap = document.createElementNS("http://www.w3.org/2000/svg", "text");
        cap.classList.add(cfg.label ? "tch-segment__caption" : "tch-segment__label");
        const lines = captionLines(cfg.caption);
        const lineH = 15;
        const origin = a.y + (cfg.label ? 10 : 0);
        const startY = origin - ((lines.length - 1) * lineH) / 2;
        cap.setAttribute("x", a.x);
        cap.setAttribute("y", startY);
        lines.forEach((line, index) => {
          const tspan = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
          tspan.setAttribute("x", a.x);
          tspan.setAttribute("dy", index === 0 ? "0" : String(lineH));
          tspan.textContent = line;
          cap.appendChild(tspan);
        });
        g.appendChild(cap);
      }
      return g;
    }

    let actionLayout = { segs: [], entries: [], levelSegs: [], levelInfos: [], weaponMenuSegs: [] };

    function drawAction() {
      const entries = sheet.action;
      const actionMain = mainSectionById("action");
      let segs = arcSegmentsForParent(entries.length, actionMain.start, actionMain.end, { maxSpanDeg: 280 });
      const attackIndex = entries.findIndex(entry => entry.kind === "attack");
      if (attackIndex >= 0) segs = centerArcOnIndex(segs, attackIndex, actionMain.start, actionMain.end);
      actionLayout = { segs, entries, levelSegs: [], levelInfos: [], weaponMenuSegs: [] };

      entries.forEach((entry, i) => {
        const seg = segs[i];
        const isNest = entry.kind === "attack" || entry.kind === "cast" || entry.kind === "ready" || entry.kind === "other" || entry.kind === "abilities" || entry.kind === "useItem";
        if (entry.kind === "cast") actionLayout.castSeg = seg;
        const g = leaf({
          start: seg.start, end: seg.end,
          inner: RINGS.actionInner, outer: RINGS.actionOuter,
          label: isNest ? entry.name : "",
          caption: !isNest ? entry.name : "",
          img: entry.img,
          active: (entry.kind === "attack" && state.attackOpen && !state.readyOpen)
            || (entry.kind === "cast" && state.castSpell && !state.readyOpen)
            || (entry.kind === "ready" && state.readyOpen)
            || (entry.kind === "other" && state.otherOpen)
            || (entry.kind === "abilities" && state.abilitiesOpen && !state.readyOpen)
            || (entry.kind === "useItem" && state.useItem)
        });
        g.addEventListener("pointerenter", () => {
          clearCollapse();
          clearNests();
          if (entry.kind === "attack") state.attackOpen = true;
          else if (entry.kind === "cast") {
            state.castSpell = true;
            state.spellEconomy = entry.economy || "action";
          } else if (entry.kind === "ready") state.readyOpen = true;
          else if (entry.kind === "other") state.otherOpen = true;
          else if (entry.kind === "abilities") state.abilitiesOpen = true;
          else if (entry.kind === "useItem") state.useItem = true;
          hideTooltip();
          draw();
        });
        svg.appendChild(g);
      });
    }

    function parentSeg(kindOrName) {
      const idx = actionLayout.entries.findIndex(e => e.kind === kindOrName || e.name === kindOrName);
      if (idx >= 0) return actionLayout.segs[idx];
      const a = mainSectionById("action");
      return { start: a.start, end: a.end };
    }

    function drawAttackNest(inner, outer) {
      const entries = state.readyOpen
        ? sheet.attack.filter(entry => entry.kind !== "cast")
        : sheet.attack;
      const parent = state.opportunityOpen
        ? (actionLayout.opportunitySeg || mainSectionById("reaction"))
        : state.readyOpen
          ? (actionLayout.readyAttackSeg || parentSeg("ready"))
          : parentSeg("attack");
      const segs = arcSegmentsForParent(entries.length, parent.start, parent.end, { maxSpanDeg: 220 });
      actionLayout.attackSegs = segs;
      actionLayout.attackEntries = entries;
      entries.forEach((entry, i) => {
        const seg = segs[i];
        if (entry.kind === "cast") actionLayout.castSeg = seg;
        const g = leaf({
          start: seg.start, end: seg.end,
          inner, outer,
          caption: entry.name,
          img: entry.img,
          itemArt: entry.kind === "weapon" || entry.kind === "weapon-attack" || entry.kind === "weapon-ability",
          active: (entry.kind === "cast" && state.castSpell) || (entry.id && entry.id === state.weaponNest)
        });
        g.addEventListener("pointerenter", (ev) => {
          clearCollapse();
          state.castSpell = entry.kind === "cast";
          state.spellLevel = state.castSpell ? state.spellLevel : null;
          state.weaponNest = (entry.kind === "weapon" && entry.hasSpecial) ? entry.id : null;
          showTooltip(entry.tooltip || { title: entry.name }, ev);
          draw();
        });
        svg.appendChild(g);
      });
    }

    function drawReady() {
      const entries = sheet.ready;
      const parent = parentSeg("ready");
      const segs = arcSegmentsForParent(entries.length, parent.start, parent.end, { maxSpanDeg: 160 });
      entries.forEach((entry, i) => {
        const seg = segs[i];
        if (entry.kind === "cast") actionLayout.castSeg = seg;
        if (entry.kind === "attack") actionLayout.readyAttackSeg = seg;
        const nest = entry.kind === "cast" || entry.kind === "attack";
        const g = leaf({
          start: seg.start, end: seg.end,
          inner: RINGS.nest1Inner, outer: RINGS.nest1Outer,
          label: nest ? entry.name : "",
          caption: nest ? "" : entry.name,
          img: entry.img,
          active: (entry.kind === "cast" && state.castSpell) || (entry.kind === "attack" && state.attackOpen)
        });
        g.addEventListener("pointerenter", () => {
          clearCollapse();
          state.featureNestId = null;
          state.attackOpen = entry.kind === "attack";
          state.castSpell = entry.kind === "cast";
          if (entry.kind === "cast") state.spellEconomy = entry.economy || "action";
          state.abilitiesOpen = false;
          state.weaponNest = null;
          state.spellLevel = state.castSpell ? state.spellLevel : null;
          hideTooltip();
          draw();
        });
        svg.appendChild(g);
      });
    }

    function drawChoiceNest(entries, inner, outer, parent) {
      const segs = arcSegmentsForParent(entries.length, parent.start, parent.end, { maxSpanDeg: 220 });
      entries.forEach((entry, i) => {
        const seg = segs[i];
        if (entry.id === state.featureNestId) actionLayout.featureSeg = seg;
        const caption = entry.usesLabel ? `${entry.name} · ${entry.usesLabel}` : entry.name;
        const g = leaf({
          start: seg.start, end: seg.end,
          inner, outer,
          caption,
          img: entry.img,
          active: entry.id === state.featureNestId
        });
        g.addEventListener("pointerenter", (ev) => {
          clearCollapse();
          state.featureNestId = entry.hasNest ? entry.id : null;
          showTooltip(entry.tooltip || { title: entry.name }, ev);
          draw();
        });
        svg.appendChild(g);
      });
    }

    function drawOtherActions(inner, outer) {
      drawChoiceNest(sheet.other, inner, outer, parentSeg("other"));
    }

    function drawAbilityFeatures(inner, outer) {
      const parent = state.readyOpen
        ? (actionLayout.readyOtherSeg || parentSeg("ready"))
        : parentSeg("abilities");
      drawChoiceNest(sheet.abilities, inner, outer, parent);
    }

    function drawFeatureModes(inner, outer) {
      const source = [...sheet.abilities, ...sheet.other, ...sheet.bonus, ...sheet.reaction];
      const feature = source.find(entry => entry.id === state.featureNestId);
      const modes = feature ? featureModesFor(feature) : [];
      const parent = actionLayout.featureSeg || parentSeg("abilities");
      const segs = arcSegmentsForParent(Math.max(modes.length, 1), parent.start, parent.end, { maxSpanDeg: 200 });
      modes.forEach((entry, i) => {
        const seg = segs[i];
        const g = leaf({
          start: seg.start, end: seg.end,
          inner, outer,
          caption: entry.name,
          img: entry.img
        });
        g.addEventListener("pointerenter", (ev) => showTooltip(entry.tooltip || { title: entry.name }, ev));
        svg.appendChild(g);
      });
    }

    function drawWeaponSpecials() {
      const weapon = (actionLayout.attackEntries || sheet.attack).find(w => w.id === state.weaponNest);
      const options = weapon ? weaponModesFor(weapon) : [];
      const idx = (actionLayout.attackEntries || []).findIndex(w => w.id === state.weaponNest);
      const parent = (idx >= 0 && actionLayout.attackSegs?.[idx]) || parentSeg("attack");
      const inner = state.readyOpen ? RINGS.nest3Inner : RINGS.nest2Inner;
      const outer = state.readyOpen ? RINGS.nest3Outer : RINGS.nest2Outer;
      const segs = arcSegmentsForParent(Math.max(options.length, 1), parent.start, parent.end, { maxSpanDeg: 180 });
      options.forEach((opt, i) => {
        const seg = segs[i];
        const g = leaf({
          start: seg.start, end: seg.end,
          inner, outer,
          caption: opt.name,
          img: opt.img
        });
        g.addEventListener("pointerenter", (ev) => showTooltip(opt.tooltip || { title: opt.name }, ev));
        svg.appendChild(g);
      });
    }

    function drawInventory() {
      const onBonus = state.section === "bonus";
      const items = onBonus ? (sheet.bonusInventory || []) : sheet.inventory;
      const parent = onBonus
        ? (actionLayout.useItemSeg || mainSectionById("bonus"))
        : parentSeg("useItem");
      const inner = onBonus ? RINGS.flatNestInner : RINGS.nest1Inner;
      const outer = onBonus ? RINGS.flatNestOuter : RINGS.nest1Outer;
      const segs = arcSegmentsForParent(Math.max(items.length, 1), parent.start, parent.end, { maxSpanDeg: 280 });
      items.forEach((item, i) => {
        const seg = segs[i];
        const g = leaf({
          start: seg.start, end: seg.end,
          inner, outer,
          caption: item.name,
          img: item.img,
          itemArt: true
        });
        g.addEventListener("pointerenter", (ev) => showTooltip(item.tooltip || { title: item.name }, ev));
        g.addEventListener("pointermove", (ev) => positionTooltip(ev));
        g.addEventListener("pointerleave", hideTooltip);
        svg.appendChild(g);
      });
    }

    function levelList() {
      if (state.section === "bonus") return sheet.bonusLevels || [];
      if (state.section === "reaction") return sheet.reactionLevels || [];
      return sheet.levels;
    }

    function drawLevels() {
      const onFlat = state.section === "bonus" || state.section === "reaction";
      const parent = actionLayout.castSeg || (onFlat ? mainSectionById(state.section) : parentSeg("cast"));
      const levels = levelList();
      const segs = arcSegmentsForParent(Math.max(levels.length, 1), parent.start, parent.end, { maxSpanDeg: 200 });
      actionLayout.levelSegs = segs;
      actionLayout.levelInfos = levels;
      const inner = onFlat ? RINGS.flatNestInner : (state.readyOpen ? RINGS.nest2Inner : RINGS.nest1Inner);
      const outer = onFlat ? RINGS.flatNestOuter : (state.readyOpen ? RINGS.nest2Outer : RINGS.nest1Outer);
      levels.forEach((lvl, i) => {
        const seg = segs[i];
        const g = leaf({
          start: seg.start, end: seg.end,
          inner, outer,
          label: lvl.label,
          caption: lvl.slots || undefined,
          img: lvl.level === 0 ? CHROME.spell0 : previewWedge(`spell-${lvl.level}`),
          active: state.spellLevel === lvl.level
        });
        g.addEventListener("pointerenter", () => {
          clearCollapse();
          state.spellLevel = lvl.level;
          draw();
        });
        svg.appendChild(g);
      });
    }

    function drawSpells(level) {
      const onFlat = state.section === "bonus" || state.section === "reaction";
      const spells = levelList().find(l => l.level === level)?.spells ?? [];
      let parent = onFlat ? (actionLayout.castSeg || mainSectionById(state.section)) : parentSeg("cast");
      const li = actionLayout.levelInfos.findIndex(l => l.level === level);
      if (li >= 0) parent = actionLayout.levelSegs[li];
      const segs = arcSegmentsForParent(Math.max(spells.length, 1), parent.start, parent.end, { maxSpanDeg: 280 });
      const inner = onFlat ? RINGS.flatSpellInner : (state.readyOpen ? RINGS.nest3Inner : RINGS.nest2Inner);
      const outer = onFlat ? RINGS.flatSpellOuter : (state.readyOpen ? RINGS.nest3Outer : RINGS.nest2Outer);
      spells.forEach((spell, i) => {
        const seg = segs[i];
        const g = leaf({
          start: seg.start, end: seg.end,
          inner, outer,
          caption: spell.name,
          img: spell.img,
          itemArt: true
        });
        g.addEventListener("pointerenter", (ev) => showTooltip(spell.tooltip || { title: spell.name }, ev));
        g.addEventListener("pointermove", (ev) => positionTooltip(ev));
        g.addEventListener("pointerleave", hideTooltip);
        svg.appendChild(g);
      });
    }

    function drawFlat(options) {
      const main = mainSectionById(state.section === "reaction" ? "reaction" : "bonus");
      const segs = arcSegmentsForParent(Math.max(options.length, 1), main.start, main.end, {
        maxSpanDeg: 300, minSegmentDeg: 32, idealSegmentDeg: 46
      });
      options.forEach((opt, i) => {
        const seg = segs[i];
        const isCast = opt.kind === "cast";
        const isUseItem = opt.kind === "useItem";
        const isFeature = opt.kind === "feature" && opt.hasNest;
        const isOpportunity = opt.kind === "opportunity";
        if (opt.id === state.featureNestId) actionLayout.featureSeg = seg;
        if (isCast) actionLayout.castSeg = seg;
        if (isUseItem) actionLayout.useItemSeg = seg;
        if (isOpportunity) actionLayout.opportunitySeg = seg;
        const caption = opt.usesLabel ? `${opt.name} · ${opt.usesLabel}` : opt.name;
        const g = leaf({
          start: seg.start, end: seg.end,
          inner: RINGS.flatInner, outer: RINGS.flatOuter,
          caption,
          img: opt.img,
          active: (isFeature && opt.id === state.featureNestId)
            || (isCast && state.castSpell)
            || (isUseItem && state.useItem)
            || (isOpportunity && state.opportunityOpen)
        });
        g.addEventListener("pointerenter", (ev) => {
          clearCollapse();
          if (isCast) {
            state.featureNestId = null;
            state.opportunityOpen = false;
            state.useItem = false;
            state.castSpell = true;
            state.spellEconomy = opt.economy || state.section;
            state.spellLevel = null;
            draw();
            hideTooltip();
            return;
          }
          if (isUseItem) {
            state.featureNestId = null;
            state.opportunityOpen = false;
            state.castSpell = false;
            state.spellLevel = null;
            state.useItem = true;
            draw();
            hideTooltip();
            return;
          }
          if (isOpportunity) {
            state.featureNestId = null;
            state.castSpell = false;
            state.spellLevel = null;
            state.useItem = false;
            state.opportunityOpen = true;
            draw();
            hideTooltip();
            return;
          }
          if (state.castSpell || state.opportunityOpen || state.useItem) {
            state.castSpell = false;
            state.spellLevel = null;
            state.opportunityOpen = false;
            state.useItem = false;
          }
          const open = isFeature ? opt.id : null;
          const changed = open !== state.featureNestId;
          state.featureNestId = open;
          if (changed) draw();
          showTooltip(opt.tooltip || { title: opt.name }, ev);
        });
        g.addEventListener("pointerleave", hideTooltip);
        svg.appendChild(g);
      });
    }

    let checksLayout = { segs: [], entries: [] };

    function drawChecksMenu() {
      const main = mainSectionById("checks");
      const entries = sheet.checksMenu;
      const segs = arcSegmentsForParent(Math.max(entries.length, 1), main.start, main.end, { maxSpanDeg: 200 });
      checksLayout = { segs, entries };
      entries.forEach((opt, i) => {
        const seg = segs[i];
        const isBranch = opt.kind === "checks-branch";
        const g = leaf({
          start: seg.start, end: seg.end,
          inner: RINGS.actionInner, outer: RINGS.actionOuter,
          caption: opt.name,
          img: opt.img || CHROME.checks,
          active: isBranch && state.checksBranch === opt.branch
        });
        g.addEventListener("pointerenter", (ev) => {
          if (pointerRadius(ev) < RINGS.actionInner) return;
          clearCollapse();
          if (isBranch) {
            if (state.checksBranch === opt.branch) return;
            state.checksBranch = opt.branch;
            draw();
            return;
          }
          if (state.checksBranch) {
            state.checksBranch = null;
            draw();
          }
          showTooltip(opt.tooltip || { title: opt.name }, ev);
        });
        svg.appendChild(g);
      });
    }

    function drawSavingThrows() {
      drawChecksLeaves(sheet.saves, "saves");
    }

    function drawSkills() {
      drawChecksLeaves(sheet.skills, "skills");
    }

    function drawChecksLeaves(options, branch) {
      let parent = mainSectionById("checks");
      const idx = checksLayout.entries.findIndex(entry => entry.kind === "checks-branch" && entry.branch === branch);
      if (idx >= 0) parent = checksLayout.segs[idx];
      const segs = arcSegmentsForParent(Math.max(options.length, 1), parent.start, parent.end, { maxSpanDeg: 200 });
      options.forEach((opt, i) => {
        const seg = segs[i];
        const g = leaf({
          start: seg.start, end: seg.end,
          inner: RINGS.nest1Inner, outer: RINGS.nest1Outer,
          caption: opt.name,
          img: opt.img,
          proficiency: opt.proficiency
        });
        g.addEventListener("pointerenter", (ev) => showTooltip(opt.tooltip || { title: opt.name }, ev));
        svg.appendChild(g);
      });
    }

    function showTooltip(data, event) {
      const rows = [];
      if (data.description) rows.push(`<p class="tch-tooltip__desc">${data.description}</p>`);
      for (const [k, v] of [["Targets", data.targets], ["Range", data.range], ["Duration", data.duration], ["Damage", data.damage]]) {
        if (v == null || v === "") continue;
        rows.push(`<div class="tch-tooltip__row"><span class="tch-tooltip__key">${k}</span><span class="tch-tooltip__value">${v}</span></div>`);
      }
      tooltipEl.innerHTML = `<p class="tch-tooltip__title">${data.title || ""}</p>${rows.join("")}`;
      tooltipEl.hidden = false;
      if (event) positionTooltip(event);
      else {
        tooltipEl.style.left = "50%";
        tooltipEl.style.top = "10%";
        tooltipEl.style.transform = "translateX(-50%)";
      }
    }

    function positionTooltip(event) {
      tooltipEl.style.transform = "none";
      tooltipEl.style.left = `${Math.min(window.innerWidth - 300, event.clientX + 16)}px`;
      tooltipEl.style.top = `${Math.min(window.innerHeight - 40, event.clientY + 16)}px`;
    }

    function hideTooltip() {
      tooltipEl.hidden = true;
      tooltipEl.innerHTML = "";
    }

    function pointerRadius(ev) {
      if (!svg || ev?.clientX == null) return Infinity;
      const pt = svg.createSVGPoint();
      pt.x = ev.clientX;
      pt.y = ev.clientY;
      const ctm = svg.getScreenCTM();
      if (!ctm) return Infinity;
      const p = pt.matrixTransform(ctm.inverse());
      return Math.hypot(p.x - CX, p.y - CY);
    }

    function clearCollapse() {
      if (collapseTimer) clearTimeout(collapseTimer);
      collapseTimer = null;
    }

    function installI18n(lang) {
      const dict = lang?.TINHEADS_COMBAT_HUD ?? {};
      const lookup = (key) => {
        const parts = String(key).replace(/^TINHEADS_COMBAT_HUD\./, "").split(".");
        let node = dict;
        for (const part of parts) node = node?.[part];
        return typeof node === "string" ? node : key;
      };
      globalThis.game = {
        i18n: {
          format(key, data) {
            let text = lookup(key);
            if (data) {
              for (const [name, value] of Object.entries(data)) {
                text = text.replaceAll(`{${name}}`, String(value));
              }
            }
            return text;
          },
          localize: lookup
        },
        user: { isGM: true, targets: new Set() }
      };
      globalThis.foundry = { utils: { duplicate: (value) => JSON.parse(JSON.stringify(value)) } };
      globalThis.CONFIG = { DND5E: { defaultArtwork: { Item: {} }, abilities: {} } };
      globalThis.CONST = { DOCUMENT_OWNERSHIP_LEVELS: { OWNER: 3, OBSERVER: 2 } };
    }

    async function boot() {
      const note = document.getElementById("preview-note");
      try {
        const [lang, raw] = await Promise.all([
          fetch("../lang/en.json").then(response => response.json()),
          fetch("./demo/cornholio.json").then(response => response.json())
        ]);
        installI18n(lang);
        const { hydrateActor } = await import("./demo/hydrate-actor.mjs");
        const { buildActionRingEntries, buildEconomyRingEntries, getAttackNestEntries, getReadyNestEntries } = await import("../scripts/data/basic-actions.mjs");
        const { getEquippedWeapons, getSpellLevels } = await import("../scripts/data/actor-options.mjs");
        const { getClassFeatureOptions, getOtherActionOptions, getFeatureModeOptions } = await import("../scripts/data/action-features.mjs");
        const { getUsableInventoryItems } = await import("../scripts/data/use-items.mjs");
        const { getSpecialWeaponOptions } = await import("../scripts/data/weapon-abilities.mjs");
        const { getChecksMenuOptions, getSavingThrowOptions, getSkillOptions } = await import("../scripts/data/ability-checks.mjs");

        const actor = hydrateActor(raw);
        const weapons = getEquippedWeapons(actor);
        sheet.name = actor.name;
        sheet.action = buildActionRingEntries(actor, weapons);
        sheet.attack = getAttackNestEntries(actor, weapons);
        sheet.ready = getReadyNestEntries(actor);
        sheet.other = getOtherActionOptions(actor);
        sheet.abilities = getClassFeatureOptions(actor, "action");
        sheet.inventory = getUsableInventoryItems(actor);
        sheet.bonusInventory = getUsableInventoryItems(actor, "bonus");
        sheet.levels = getSpellLevels(actor, "action").levels;
        sheet.bonusLevels = getSpellLevels(actor, "bonus").levels;
        sheet.reactionLevels = getSpellLevels(actor, "reaction").levels;
        sheet.bonus = buildEconomyRingEntries(actor, "bonus");
        sheet.reaction = buildEconomyRingEntries(actor, "reaction");
        sheet.checksMenu = getChecksMenuOptions(actor);
        sheet.saves = getSavingThrowOptions(actor);
        sheet.skills = getSkillOptions(actor);
        featureModesFor = getFeatureModeOptions;
        weaponModesFor = getSpecialWeaponOptions;
        if (note) {
          note.textContent = `${actor.name}. Hover a wedge. This is his sheet, run through the same HUD lists Foundry uses. Foundry item art is not in this folder, so missing pictures fall back to the module wedge.`;
        }
        mount();
      } catch (error) {
        if (note) note.textContent = `Could not load Cornholio: ${error.message}`;
        console.error(error);
      }
    }

    boot();
  </script>
</body>
</html>
